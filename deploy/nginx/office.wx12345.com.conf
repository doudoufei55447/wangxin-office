# office.wx12345.com — 网信办公 介绍/下载页（静态 / HTTPS 正式态）
server {
    listen 80;
    server_name office.wx12345.com;

    # Let's Encrypt HTTP-01 校验根（与现有站点共用 C:/nginx/acme）
    location /.well-known/acme-challenge/ { root C:/nginx/acme; }
    # 全量跳转 HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name office.wx12345.com;

    ssl_certificate     C:/nginx/ssl/office.wx12345.com/office.wx12345.com-chain.pem;
    ssl_certificate_key C:/nginx/ssl/office.wx12345.com/office.wx12345.com-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root C:/nginx/nginx-1.26.2/html/office.wx12345.com;
    index index.html;

    # 安装包下载：强制浏览器另存为，不直接打开
    location /download/ {
        location ~* \.(exe|msi|dmg)$ {
            add_header Content-Disposition "attachment" always;
            default_type application/octet-stream;
        }
    }

    location / { try_files $uri $uri/ =404; }
}
