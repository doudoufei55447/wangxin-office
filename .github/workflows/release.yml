name: Release Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows (msi + nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        run: choco install nsis -y
      - name: Install deps
        run: npm install
      - name: Generate icon set
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build installers
        run: npm run tauri build
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: src-tauri/target/release/bundle/**

  macos:
    name: macOS (dmg + app)
    runs-on: macos-latest
    env:
      # 签名 Secrets；公证 Secrets 不放这里——否则 Tauri 会在 build 内部静默公证，卡住时日志全黑箱。
      # 公证拆到独立步骤（Notarize & staple），notarytool 输出逐行可见。
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      NOTARIZE_ENABLED: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: npm install
      - name: Import signing certificate (optional, needs repo secrets)
        if: env.APPLE_CERTIFICATE != ''
        run: |
          mkdir -p ~/certs
          echo "$APPLE_CERTIFICATE" | base64 --decode -o ~/certs/cert.p12
          security create-keychain -p buildpwd build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p buildpwd build.keychain
          security import ~/certs/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k buildpwd build.keychain
      - name: Generate icon set
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build installers
        timeout-minutes: 45
        run: npm run tauri build
      - name: Notarize & staple (observable, poll history)
        if: env.NOTARIZE_ENABLED == 'true' && env.APPLE_SIGNING_IDENTITY != ''
        timeout-minutes: 85
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          AUTH=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")

          echo "== [0/4] notarytool history: 查看此前所有提交的最终处理结果 =="
          xcrun notarytool history "${AUTH[@]}" --output-format json || true

          DMGS=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#DMGS[@]} -eq 0 ]; then
            echo "ERROR: no dmg found under bundle/dmg/"
            exit 1
          fi

          for f in "${DMGS[@]}"; do
            echo "== [1/4] submit (no-wait): $f =="
            OUT=$(xcrun notarytool submit "$f" "${AUTH[@]}" --no-wait --output-format json)
            echo "$OUT"
            SUB_ID=$(echo "$OUT" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" || true)
            if [ -z "$SUB_ID" ]; then
              SUB_ID=$(echo "$OUT" | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)
            fi
            if [ -z "$SUB_ID" ]; then
              echo "ERROR: cannot get submission id"
              exit 1
            fi
            echo "   submission id: $SUB_ID"

            echo "== [2/4] poll status (每 60s 一次，最长 75 分钟) =="
            STATUS=""
            for i in $(seq 1 75); do
              sleep 60
              RAW=$(xcrun notarytool history "${AUTH[@]}" 2>/dev/null || true)
              STATUS=$(echo "$RAW" | grep -A8 "$SUB_ID" | grep -Eo 'Accepted|Invalid|Rejected|In Progress' | head -1 || true)
              if [ -z "$STATUS" ]; then
                LOGP=$(xcrun notarytool log "$SUB_ID" "${AUTH[@]}" --output-format json 2>/dev/null || true)
                STATUS=$(echo "$LOGP" | grep -o '"status": *"[^"]*"' | head -1 | grep -Eo 'Accepted|Invalid|Rejected|In Progress' || true)
              fi
              echo "   [poll $i] ${STATUS:-unknown}"
              if [ "$STATUS" = "Accepted" ] || [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then break; fi
            done

            echo "== [3/4] 拉取 Apple 最终裁决日志（以此为准） =="
            LOG=$(xcrun notarytool log "$SUB_ID" "${AUTH[@]}" --output-format json 2>/dev/null || true)
            echo "$LOG"
            FINAL=$(echo "$LOG" | grep -o '"status": *"[^"]*"' | head -1 | sed 's/"status": *"\(.*\)"/\1/')
            if [ -z "$FINAL" ]; then FINAL="$STATUS"; fi
            echo "   final status: ${FINAL:-unknown}"

            if [ "$FINAL" != "Accepted" ]; then
              if [ -z "$FINAL" ]; then
                echo "=> Apple 长时间未出结果（新开发者账号首次提交可能排队数小时）。1-2 小时后重跑一次即可，history 会显示历史提交结果。"
              fi
              exit 1
            fi

            echo "== [4/4] stapler staple + validate: $f =="
            xcrun stapler staple "$f"
            xcrun stapler validate "$f"
          done
          echo "NOTARIZATION COMPLETE"
      - name: Attach first-launch note
        if: env.APPLE_CERTIFICATE == ''
        run: |
          NOTE="src-tauri/target/release/bundle/macOS-首次打开说明.txt"
          mkdir -p "$(dirname "$NOTE")"
          {
            echo '【macOS 首次打开提示"已损坏或不完整"的解决办法】'
            echo ''
            echo '本安装包暂未做 Apple 开发者签名与公证，从网上下载后会被 macOS 打上'
            echo '隔离标记，首次打开会被 Gatekeeper 拒绝。这不是文件损坏。'
            echo ''
            echo '装好后，在「终端」执行一次（复制整行）：'
            echo '    xattr -cr "/Applications/网信办公.app"'
            echo ''
            echo '然后正常双击打开即可，只需执行一次。'
          } > "$NOTE"
      - name: Upload
        if: '!cancelled()'
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: src-tauri/target/release/bundle/dmg/*.dmg
